@keyframes tabFadeSlide {
  0% {
    opacity: 0;
    transform: translateY(10px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}
.tab-content-anim {
  animation: tabFadeSlide 0.28s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
.no-scrollbar::-webkit-scrollbar {
  display: none;
}
.no-scrollbar {
  -ms-overflow-style: none;
  scrollbar-width: none;
}

/* Responsive layout fixes for PC, Tablet & Mobile */
@media (min-width: 640px) {
  .sm\:hidden { display: none !important; }
  .sm\:flex { display: flex !important; }
  .sm\:flex-row { flex-direction: row !important; }
  .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  .sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
  .sm\:table-cell { display: table-cell !important; }
}

@media (max-width: 639px) {
  .hidden.sm\:flex { display: none !important; }
  .hidden.sm\:block { display: none !important; }
}

@media (min-width: 1024px) {
  .lg\:col-span-5 { grid-column: span 5 / span 5 !important; }
  .lg\:col-span-7 { grid-column: span 7 / span 7 !important; }
}

/* Mockup window layout */
.mockup-window {
  position: relative !important;
  overflow: visible !important;
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  max-width: 780px !important;
  background: #ffffff !important;
  border-radius: 1.25rem !important;
  border: 1px solid rgba(226, 232, 240, 0.95) !important;
  box-shadow: 0 20px 35px -8px rgba(15, 23, 42, 0.08), 0 10px 18px -6px rgba(15, 23, 42, 0.04) !important;
  overflow: visible !important;
  position: relative !important;
}

@media (min-width: 640px) {
  .mockup-window {
    flex-direction: row !important;
    height: 520px !important;
    max-height: 540px !important;
  }
}

@media (max-width: 639px) {
  .mockup-window {
    height: auto !important;
    overflow: visible !important;
  }
}

.mockup-sidebar {
  width: 135px !important;
  min-width: 135px !important;
  max-width: 135px !important;
  background: #ffffff !important;
  border-right: 1px solid rgba(226, 232, 240, 0.9) !important;
  flex-shrink: 0 !important;
}

@media (min-width: 1280px) {
  .mockup-sidebar {
    width: 142px !important;
    min-width: 142px !important;
    max-width: 142px !important;
  }
}

.mockup-main {
  flex: 1 1 0% !important;
  min-width: 0 !important;
  overflow-y: auto !important;
  max-height: 520px !important;
}

.scrollbar-thin::-webkit-scrollbar {
  width: 5px;
  height: 5px;
}
.scrollbar-thin::-webkit-scrollbar-track {
  background: #f8fafc;
}
.scrollbar-thin::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 4px;
}
.scrollbar-thin::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}


/* Hero title responsive font clamp and wrapping fix */
.hero-title {
  font-feature-settings: "palt" !important;
  font-size: clamp(1.15rem, 5.6vw, 1.75rem) !important;
  line-height: 1.34 !important;
  max-width: 100% !important;
  word-break: normal !important;
  overflow-wrap: break-word !important;
}

/* Ensure Line 1 and Line 2 are EACH on their own single line without breaking */
.hero-title > span:nth-of-type(1) {
  white-space: nowrap !important;
  display: block !important;
  max-width: 100% !important;
}

.hero-title > span:nth-of-type(2) {
  white-space: nowrap !important;
  display: block !important;
  max-width: 100% !important;
}

@media (max-width: 430px) {
  .hero-title {
    font-size: clamp(1.15rem, 5.6vw, 1.6rem) !important;
    line-height: 1.34 !important;
  }
}

@media (min-width: 431px) and (max-width: 767px) {
  .hero-title {
    font-size: clamp(1.35rem, 4.6vw, 1.85rem) !important;
    line-height: 1.34 !important;
  }
}

@media (min-width: 768px) and (max-width: 1023px) {
  .hero-title {
    font-size: clamp(1.5rem, 3.6vw, 2.0rem) !important;
    line-height: 1.34 !important;
  }
}

@media (min-width: 1024px) {
  .hero-title {
    font-size: 30px !important;
    line-height: 1.34 !important;
  }
  .hero-title > span:nth-of-type(1),
  .hero-title > span:nth-of-type(2),
  .hero-title > span {
    font-size: 30px !important;
    white-space: nowrap !important;
    display: inline-block !important;
  }
}

@media (min-width: 1280px) {
  .hero-title {
    font-size: 30px !important;
    line-height: 1.34 !important;
  }
  .hero-title > span:nth-of-type(1),
  .hero-title > span:nth-of-type(2),
  .hero-title > span {
    font-size: 30px !important;
  }
}
/* Guarantees Hero content is never covered by the fixed top header bar on any screen size */
.hero-main {
  padding-top: 130px !important;
}
@media (min-width: 640px) {
  .hero-main {
    padding-top: 145px !important;
  }
}
@media (min-width: 1024px) {
  .hero-main {
    padding-top: 160px !important;
  }

/* ==========================================================================
   Hero First View (FV) Abstract Moving Gradient Background Layer
   - 3-Layer Depth: 1. Base White -> 2. Soft Moving Gradient -> 3. Content & Demo UI
   - Palette: Clean White + Soft Brand Blues (#2b88f0, #93c5fd, #bae6fd)
   - Motion: Subtle drift (20-28s loops, ease-in-out, 30-80px displacement, 1.00-1.03 scale)
   - Mobile: Scaled down 50-70% motion, lower opacity, perfect text clarity
   - Accessibility: prefers-reduced-motion stops animation cleanly
   ========================================================================== */
.hero-fv-wrapper {
  position: relative !important;
  width: 100% !important;
  background: linear-gradient(145deg, #f4f8ff 0%, #ffffff 42%, #eef5ff 78%, #ffffff 100%) !important;
  overflow: visible !important;
}

.hero-abstract-bg {
  position: absolute !important;
  inset: 0 !important;
  pointer-events: none !important;
  overflow: hidden !important;
  z-index: 0 !important;
}

.hero-gradient-blob {
  position: absolute !important;
  border-radius: 9999px !important;
  pointer-events: none !important;
  z-index: 1 !important;
  will-change: transform, opacity !important;
}

/* Blob 1: Top-Left soft cyan/sky glow behind headline (PC / Tablet) */
.hero-blob-1 {
  top: -10% !important;
  left: -2% !important;
  width: clamp(420px, 50vw, 750px) !important;
  height: clamp(420px, 50vw, 750px) !important;
  background: radial-gradient(circle, rgba(147, 197, 253, 0.68) 0%, rgba(191, 219, 254, 0.38) 45%, rgba(255, 255, 255, 0) 75%) !important;
  filter: blur(52px) !important;
  opacity: 0.60 !important;
  animation: floatBlob1 24s ease-in-out infinite !important;
}

/* Blob 2: Right side brand blue glow wrapping behind Demo UI (PC / Tablet) */
.hero-blob-2 {
  top: 5% !important;
  right: -5% !important;
  width: clamp(480px, 55vw, 820px) !important;
  height: clamp(480px, 55vw, 820px) !important;
  background: radial-gradient(circle, rgba(59, 130, 246, 0.48) 0%, rgba(96, 165, 250, 0.30) 48%, rgba(255, 255, 255, 0) 75%) !important;
  filter: blur(58px) !important;
  opacity: 0.58 !important;
  animation: floatBlob2 26s ease-in-out infinite !important;
}

/* Blob 3: Center-Bottom gentle azure glow between CTA and Stats transition (PC / Tablet) */
.hero-blob-3 {
  bottom: -8% !important;
  left: 20% !important;
  width: clamp(380px, 45vw, 680px) !important;
  height: clamp(380px, 45vw, 680px) !important;

  filter: blur(48px) !important;
  opacity: 0.48 !important;
  animation: floatBlob3 22s ease-in-out infinite !important;
}

/* Broad organic Blue Wave Layer crossing behind the FV content */
.hero-blue-ribbon {
  position: absolute !important;
  top: 10% !important;
  left: -24% !important;
  width: clamp(1200px, 165vw, 2200px) !important;
  height: clamp(300px, 31vw, 410px) !important;
  border-radius: 62% 38% 56% 44% / 70% 35% 65% 30% !important;
  background: linear-gradient(
    112deg,
    rgba(255, 255, 255, 0) 0%,
    rgba(219, 234, 254, 0.32) 8%,
    rgba(186, 230, 253, 0.42) 22%,
    rgba(147, 197, 253, 0.40) 38%,
    rgba(96, 165, 250, 0.34) 53%,
    rgba(59, 130, 246, 0.25) 67%,
    rgba(147, 197, 253, 0.34) 82%,
    rgba(219, 234, 254, 0.24) 93%,
    rgba(255, 255, 255, 0) 100%
  ), radial-gradient(
    ellipse at 46% 43%,
    rgba(147, 197, 253, 0.18) 0%,
    rgba(186, 230, 253, 0.12) 38%,
    rgba(219, 234, 254, 0) 72%
  ) !important;
  opacity: 0.78 !important;

  z-index: 2 !important;
  will-change: transform, opacity !important;
  animation: floatRibbon 25s ease-in-out infinite !important;
}

.hero-blue-ribbon::before {
  content: "" !important;
  position: absolute !important;
  inset: 3% -1% -1% 1% !important;
  border-radius: 38% 62% 44% 56% / 54% 42% 58% 46% !important;
  background: linear-gradient(
    108deg,
    rgba(219, 234, 254, 0.12) 0%,

  animation: floatRibbonLayer 28s ease-in-out infinite !important;
