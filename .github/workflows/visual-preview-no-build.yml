name: Direct Index Preview (Temporary)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: direct-index-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture committed index.html directly
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Start static preview server without build
        run: |
          python3 -m http.server 3000 --bind 0.0.0.0 > /tmp/vni-direct-preview-server.log 2>&1 &
          echo $! > /tmp/vni-direct-preview-server.pid

      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "Direct preview server is ready."
              exit 0
            fi
            sleep 1
          done

          echo "Direct preview server did not become ready."
          cat /tmp/vni-direct-preview-server.log || true
          exit 1

      - name: Verify Reason01 repository image
        run: |
          curl --fail --silent --show-error             -o /tmp/reason01.png             http://127.0.0.1:3000/assets/images/3reasons-scattered.png
          file /tmp/reason01.png
          test -s /tmp/reason01.png

      - name: Capture desktop, tablet, and mobile previews
        env:
          PREVIEW_URL: http://127.0.0.1:3000/
        run: node scripts/visual-preview.mjs

      - name: Upload direct preview artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: direct-index-preview-${{ github.sha }}
          path: visual-preview/
          if-no-files-found: error
          retention-days: 7
          compression-level: 6
