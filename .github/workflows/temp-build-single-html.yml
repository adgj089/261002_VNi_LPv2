name: Temporary build single HTML

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-build-single-html.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build index.html
        run: npm run build
      - name: Verify only index changed
        run: |
          git status --short
          test "$(git status --short | grep -v '^??' | grep -v ' index.html$' | wc -l)" -eq 0
      - name: Commit generated index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Build index after dynamic translation fix"
          git push
